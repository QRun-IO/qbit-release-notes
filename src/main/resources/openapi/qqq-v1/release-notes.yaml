components:
  schemas:
    BasicErrorResponseV1:
      description: "The error body of every UI API operation (core and extensions)."
      properties:
        error:
          description: "The error message (the same as message; kept for clients of\
            \ UI API 1.0 to 1.5)."
          type: "string"
        code:
          description: "A stable, machine-readable code. Well-known values: BAD_REQUEST\
            \ (400), UNAUTHENTICATED (401),\nPERMISSION_DENIED (403), NOT_FOUND (404),\
            \ CONFLICT (409), RATE_LIMITED (429), INTERNAL_ERROR (500),\nERROR (other).\
            \ Extensions may add codes; treat an unknown code by the HTTP status.\
            \ Since 1.6.0."
          type: "string"
        message:
          description: "A message to show the user. Since 1.6.0."
          type: "string"
        fieldErrors:
          description: "Errors about particular request fields, when known. Since\
            \ 1.6.0."
          items:
            properties:
              field:
                description: "The field (or parameter) name."
                type: "string"
              message:
                description: "The error about that field."
                type: "string"
              code:
                description: "An optional machine-readable code, e.g. REQUIRED, TOO_LONG,\
                  \ PATTERN."
                type: "string"
            type: "object"
          type: "array"
        traceId:
          description: "Identifies this request in the server logs (also the X-QQQ-Trace-Id\
            \ response header); quote it when reporting a problem. Since 1.6.0."
          type: "string"
      type: "object"
    ReleaseNotesErrorV1:
      properties:
        error:
          description: "What went wrong."
          type: "string"
      type: "object"
    ReleaseNotesItemV1:
      properties:
        category:
          description: "Item category."
          enum:
          - "NEW"
          - "IMPROVED"
          - "FIXED"
          - "SECURITY"
          - "REMOVED"
          type: "string"
        categoryLabel:
          description: "Category label, e.g. New."
          type: "string"
        linkUrl:
          description: "Optional app path or https link."
          nullable: true
          type: "string"
        screenshotUrl:
          description: "Optional screenshot URL."
          nullable: true
          type: "string"
        text:
          description: "Customer-facing text."
          type: "string"
      type: "object"
    ReleaseNotesLatestV1:
      properties:
        id:
          description: "Release id."
          type: "integer"
        publishedAt:
          description: "When it was published (ISO-8601)."
          type: "string"
        title:
          description: "Release title."
          type: "string"
        version:
          description: "Application version."
          type: "string"
      type: "object"
    ReleaseNotesReleaseV1:
      properties:
        id:
          description: "Release id."
          type: "integer"
        isNew:
          description: "Published after the user last looked."
          type: "boolean"
        items:
          description: "Included items in category order."
          items:
            $ref: "#/components/schemas/ReleaseNotesItemV1"
          type: "array"
        publishedAt:
          description: "When it was published (ISO-8601)."
          type: "string"
        summary:
          description: "Short summary."
          nullable: true
          type: "string"
        title:
          description: "Release title."
          type: "string"
        version:
          description: "Application version."
          type: "string"
      type: "object"
    ReleaseNotesReleasesV1:
      properties:
        lastSeenAt:
          description: "When the user last marked What's new as seen."
          nullable: true
          type: "string"
        releases:
          description: "This page of releases, newest first."
          items:
            $ref: "#/components/schemas/ReleaseNotesReleaseV1"
          type: "array"
        total:
          description: "Visible published releases."
          type: "integer"
        unreadCount:
          description: "Releases new to the user."
          type: "integer"
      type: "object"
    ReleaseNotesSeenV1:
      properties:
        unreadCount:
          description: "Always 0 after marking seen."
          type: "integer"
      type: "object"
    ReleaseNotesSummaryV1:
      properties:
        latest:
          $ref: "#/components/schemas/ReleaseNotesLatestV1"
          description: "The newest visible release, or null."
          nullable: true
        unreadCount:
          description: "Releases new to the user."
          type: "integer"
      type: "object"
  securitySchemes:
    sessionUuidCookie:
      description: "The session cookie set by POST /qqq/v1/manageSession (web clients)."
      in: "cookie"
      name: "sessionUUID"
      type: "apiKey"
    bearerAuth:
      bearerFormat: "JWT or session UUID"
      description: "`Authorization: Bearer <token>`, where the token is either\n-\
        \ an OAuth2 access token (a signed JWT) issued by the app's identity provider\
        \ to the app's client,\n  or to its native client (`values.nativeClientId`\
        \ in GET /qqq/v1/metaData/authentication), for\n  example from the device-authorization\
        \ grant or auth-code + PKCE. It is verified against the\n  provider's keys\
        \ (issuer, audience, expiry, signature) and gives the same user and permissions\n\
        \  as signing in on the web. When it expires (401), refresh it at the provider\
        \ and retry; or\n- a session UUID returned by POST /qqq/v1/manageSession,\
        \ which the server keeps refreshed."
      scheme: "bearer"
      type: "http"
    oauth2:
      description: "The app's OAuth2 / OpenID Connect provider. The real endpoints\
        \ come from the provider's discovery\ndocument: `{values.baseUrl}.well-known/openid-configuration`,\
        \ with values from\nGET /qqq/v1/metaData/authentication. Native clients use\
        \ `values.nativeClientId` (a public client)\nwith auth-code + PKCE (loopback\
        \ or custom-scheme redirect URI registered at the provider) or the\ndevice-authorization\
        \ grant (`device_authorization_endpoint`, RFC 8628), then send the access\
        \ token\nas `Authorization: Bearer`."
      flows:
        authorizationCode:
          authorizationUrl: "/authorize"
          scopes:
            email: "Email address"
            offline_access: "A refresh token, to renew the access token without signing\
              \ in again"
            openid: "OpenID Connect sign-in"
            profile: "Name, username and groups (permissions come from the groups)"
          tokenUrl: "/token"
      type: "oauth2"
info:
  contact:
    email: "contact@kingsrook.com"
  description: "What's new: published release notes and each user's unread count"
  title: "QQQ Middleware API extension: release-notes"
  version: "1.0.0"
openapi: "3.0.3"
paths:
  /qqq/v1/qbit/release-notes/releases:
    get:
      description: "Published releases visible to the signed-in user, newest first,\
        \ with their customer-facing items and whether each is new to the user."
      operationId: "releaseNotesReleases"
      parameters:
      - description: "Releases per page (1-50, default 20)."
        in: "query"
        name: "limit"
        required: false
        schema:
          type: "integer"
      - description: "Releases to skip (default 0)."
        in: "query"
        name: "offset"
        required: false
        schema:
          type: "integer"
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseNotesErrorV1"
          description: "Invalid request"
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseNotesErrorV1"
          description: "Sign in required"
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseNotesReleasesV1"
          description: "Successful Response"
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "The user (or the credential's scope) may not do this (code\
            \ PERMISSION_DENIED)."
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found, or not visible to this user (code NOT_FOUND)."
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Conflict with the current state, e.g. an edit conflict or\
            \ an invalid transition (code CONFLICT)."
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Too many requests (code RATE_LIMITED); retry later."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "Published release notes"
      tags:
      - "release-notes"
  /qqq/v1/qbit/release-notes/summary:
    get:
      description: "How many published releases are new to the signed-in user, and\
        \ the latest one, for a menu badge."
      operationId: "releaseNotesSummary"
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseNotesErrorV1"
          description: "Invalid request"
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseNotesErrorV1"
          description: "Sign in required"
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseNotesSummaryV1"
          description: "Successful Response"
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "The user (or the credential's scope) may not do this (code\
            \ PERMISSION_DENIED)."
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found, or not visible to this user (code NOT_FOUND)."
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Conflict with the current state, e.g. an edit conflict or\
            \ an invalid transition (code CONFLICT)."
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Too many requests (code RATE_LIMITED); retry later."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "What's new summary"
      tags:
      - "release-notes"
  /qqq/v1/qbit/release-notes/seen:
    post:
      description: "Clears the signed-in user's new indicator. Takes no body."
      operationId: "releaseNotesSeen"
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseNotesErrorV1"
          description: "Invalid request"
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseNotesErrorV1"
          description: "Sign in required"
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseNotesSeenV1"
          description: "Successful Response"
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "The user (or the credential's scope) may not do this (code\
            \ PERMISSION_DENIED)."
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found, or not visible to this user (code NOT_FOUND)."
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Conflict with the current state, e.g. an edit conflict or\
            \ an invalid transition (code CONFLICT)."
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Too many requests (code RATE_LIMITED); retry later."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "Mark What's new as seen"
      tags:
      - "release-notes"
servers:
- description: "The QQQ server that serves this document (paths include /qqq/v1)."
  url: "/"
tags:
- description: "Operations of the release-notes extension."
  name: "release-notes"
